# Compiles only (the owner's decision, 2026-10-31: GitHub minutes are for
# compiling; every test runs on the owner's PC before each push, CLAUDE.md).
# Windows: mirrors the build verified locally in BUILDING.md (MSYS2 UCRT64).
# macOS: Apple Clang and Homebrew packages, which warn where GCC does not
# (e.g. unused lambda captures). The iPad build is ipad.yml. Branch pushes
# only (a tag is built by ipad.yml and release.yml); documentation-only
# pushes skip CI; a newer push to the same branch cancels a run still in
# progress. Failed steps report their error lines as annotations, which
# anyone can read (scripts/ci/run-logged.sh).
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'scripts/dev/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'scripts/dev/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            diffutils
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-opencascade
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-eigen3
      - name: Configure
        run: bash scripts/ci/run-logged.sh configure cmake --preset msys2-ucrt64 -DOPENSHAPE_WARNINGS_AS_ERRORS=ON -DOPENSHAPE_BUILD_TOOLS=ON
      - name: Build
        run: bash scripts/ci/run-logged.sh build cmake --build build/msys2-ucrt64

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LOGS: ${{ github.workspace }}/ci-logs
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26 (as the iPad build)
        run: bash scripts/ci/select-xcode.sh
      - name: Install dependencies
        run: bash scripts/ci/run-logged.sh brew brew install ninja opencascade qtbase qtdeclarative qtshadertools qtsvg nlohmann-json libzip eigen googletest
      - name: Configure
        run: bash scripts/ci/run-logged.sh configure cmake --preset macos -DOPENSHAPE_WARNINGS_AS_ERRORS=ON -DOPENSHAPE_BUILD_TOOLS=ON
      - name: Build
        run: bash scripts/ci/run-logged.sh build cmake --build build/macos -- -k 0 # all errors at once
