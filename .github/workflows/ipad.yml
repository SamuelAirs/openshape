# The iOS app (universal: iPhone and iPad), built on a GitHub-hosted Mac (docs/IPAD.md): the libraries
# for iOS (OpenCASCADE takes about half an hour; cached afterwards), Qt for
# iOS (cached), then an unsigned archive of the app. Pushes to main - or a
# commit whose message contains [testflight] - then sign it and upload it to
# TestFlight, once the signing secrets are set (APPLE_TEAM_ID,
# APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY),
# for internal testing only.
# A release tag v<version>... (the version in CMakeLists.txt, optionally with
# a suffix such as -beta1) makes an App Store / public beta build
# (docs/LICENSING.md, "The iOS app and the App Store"): the tag goes into the
# app (About -> Licenses names its source code), the license gate must pass
# (scripts/ios/build-app.sh), and the upload may go to external testers and
# App Store review. Only such builds are submitted, so every App Store
# version is a tag whose GitHub release carries the iOS libraries' source
# (release.yml).
# Failed steps report their error lines as annotations (scripts/ci/run-logged.sh).
name: iPad

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'scripts/dev/**']
  workflow_dispatch:

# Queue instead of cancelling: a cancelled first run would lose the
# OpenCASCADE build before it is cached.
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      QT_VERSION: 6.11.2
      LOGS: ${{ github.workspace }}/ci-logs
      OPENSHAPE_BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.APP_STORE_CONNECT_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Release tags: an App Store / public beta build (see the top).
      OPENSHAPE_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      OPENSHAPE_LICENSE_GATE: ${{ startsWith(github.ref, 'refs/tags/v') && 'required' || 'warn' }}
      TESTFLIGHT_INTERNAL_ONLY: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          case "${OPENSHAPE_RELEASE_TAG#v}" in
            "$version"|"$version"-*) ;;
            *) echo "::error title=Version::tag $OPENSHAPE_RELEASE_TAG does not match the version in CMakeLists.txt ($version)"; exit 1 ;;
          esac
          echo "::notice title=Release build::$OPENSHAPE_RELEASE_TAG (OpenShape $version): an App Store / public beta build"
      - name: Check the license texts (pins, Licenses view)
        run: bash scripts/ci/run-logged.sh licenses python3 scripts/licenses/licenses.py check --quiet
      - name: Select Xcode 26
        run: bash scripts/ci/select-xcode.sh
      - name: Install build tools
        run: bash scripts/ci/run-logged.sh brew brew install ninja

      - name: Restore the iOS libraries
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ~/openshape-ios-deps
          key: ios-deps-${{ hashFiles('scripts/ios/build-deps.sh', 'scripts/ios/fetch-source.sh', 'scripts/ios/sources.txt') }}
      - name: Build the iOS libraries (OpenCASCADE, FreeType, libzip, json, Eigen)
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/ci/run-logged.sh deps bash scripts/ios/build-deps.sh ~/openshape-ios-deps "$RUNNER_TEMP/ios-deps-work"
      - name: Save the iOS libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/openshape-ios-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Restore Qt
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-ios-macos
      - name: Install Qt for iOS and macOS
        if: steps.qt.outputs.cache-hit != 'true'
        run: bash scripts/ci/run-logged.sh qt bash scripts/ios/install-qt.sh "$QT_VERSION" ~/Qt
      - name: Save Qt
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Qt
          key: ${{ steps.qt.outputs.cache-primary-key }}

      - name: Build the iOS app for iPhone and iPad (unsigned archive)
        run: |
          bash scripts/ci/run-logged.sh app bash scripts/ios/build-app.sh ~/Qt/$QT_VERSION/ios ~/openshape-ios-deps build/ios
          app=build/ios/OpenShape.xcarchive/Products/Applications/OpenShape.app
          echo "::notice title=iOS app (iPhone + iPad)::$(du -sh $app | cut -f1), build $OPENSHAPE_BUILD_NUMBER, iOS $(plutil -extract MinimumOSVersion raw $app/Info.plist)+, device families $(plutil -extract UIDeviceFamily json -o - $app/Info.plist), $(lipo -archs $app/OpenShape)"
          echo "::notice title=QML modules linked::$(tr '\n' ' ' < build/ios/qml-modules.txt) ."
          echo "::notice title=Controls styles not linked (TD-36)::$(cat build/ios/src/app/.qt/qml_imports/openshape_dropped_styles.txt) ."
          echo "::notice title=QML import scan (start)::$(head -c 1500 build/ios/src/app/.qt/qml_imports/openshape_conf.cmake | tr '\n%' ' _')"
          # What the app links, by origin, and the license gate's result (docs/LICENSING.md).
          echo "::notice title=Linked into the app (license gate)::$(grep -E '^  (qt|component|system) ' build/ios/license-gate.txt | cut -c1-300 | tr '\n%' '; ' || true)"
          if grep -q '^License gate: PASS' build/ios/license-gate.txt; then
            echo "::notice title=License gate::$(tail -n 1 build/ios/license-gate.txt)"
          else
            echo "::warning title=License gate::$(grep -E 'FAIL|UNKNOWN|^    ' build/ios/license-gate.txt | head -n 20 | cut -c1-300 | tr '\n%' '; ') (required for release tags)"
          fi

      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[testflight]'))
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY" > "$ASC_KEY_PATH"
          bash scripts/ci/run-logged.sh testflight bash scripts/ios/testflight.sh build/ios/OpenShape.xcarchive "$RUNNER_TEMP/testflight"
          if [ -n "$OPENSHAPE_RELEASE_TAG" ]; then
            echo "::notice title=TestFlight::build $OPENSHAPE_BUILD_NUMBER from $OPENSHAPE_RELEASE_TAG uploaded for external testing and App Store review: the build to submit for $OPENSHAPE_RELEASE_TAG (docs/LICENSING.md)"
          else
            echo "::notice title=TestFlight::build $OPENSHAPE_BUILD_NUMBER uploaded for internal testing; it appears in TestFlight after Apple's processing (usually 5-30 minutes)"
          fi
      - name: No TestFlight upload
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice title=TestFlight::not uploaded - the signing secrets are not set (docs/IPAD.md)"
